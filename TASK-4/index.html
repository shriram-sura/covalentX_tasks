<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather API Portal</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Weather API Portal</h1>

        <div class="search-box">

            <input
                type="text"
                id="cityInput"
                placeholder="Enter City Name">

            <button id="searchBtn">
                Search
            </button>

        </div>

        <button id="locationBtn">
            Use Current Location
        </button>

        <div id="weatherCard" class="weather-card">

            <h2 id="city"></h2>

            <p id="temperature"></p>

            <p id="wind"></p>

            <p id="condition"></p>

        </div>

    </div>

<script src="script.js"></script>

</body>

</html>
